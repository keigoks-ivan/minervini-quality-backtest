name: Daily QGM Screener

on:
  schedule:
    # 23:00 UTC = 07:00 TPE (next day)
    - cron: '0 23 * * *'
  workflow_dispatch:

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-

      - name: Cache yfinance data
        uses: actions/cache@v5
        with:
          path: data/cache/
          key: yf-cache-${{ hashFiles('data/universe/*.parquet') }}
          restore-keys: |
            yf-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily screener
        run: python -m live.daily_screener

      - name: Checkout financial-analysis-bot
        uses: actions/checkout@v6
        with:
          repository: keigoks-ivan/financial-analysis-bot
          token: ${{ secrets.RESEARCH_REPO_TOKEN }}
          path: _deploy

      - name: Safety check — verify CNAME unchanged
        run: |
          EXPECTED="research.investmquest.com"
          if [ ! -f _deploy/docs/CNAME ]; then
            echo "::error::CNAME file missing"
            exit 1
          fi
          ACTUAL=$(tr -d '\n\r' < _deploy/docs/CNAME)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::CNAME mismatch! Expected '$EXPECTED', got '$ACTUAL'. Aborting."
            exit 1
          fi
          echo "CNAME check passed: $ACTUAL"

      - name: Copy output to deploy repo
        run: |
          mkdir -p _deploy/docs/qgm/archive
          TODAY=$(TZ='Asia/Taipei' date +%Y-%m-%d)

          # Main files
          cp live/output/latest.html _deploy/docs/qgm/latest.html
          cp live/output/latest.json _deploy/docs/qgm/latest.json

          # Archive with date (preserves all history)
          if [ -f live/output/candidates_${TODAY}.html ]; then
            cp live/output/candidates_${TODAY}.html _deploy/docs/qgm/archive/
            echo "Archived: candidates_${TODAY}.html"
          else
            echo "::error::Expected file live/output/candidates_${TODAY}.html not found. daily_screener output is broken."
            exit 1
          fi

          if [ -f live/output/snapshot_${TODAY}.json ]; then
            cp live/output/snapshot_${TODAY}.json _deploy/docs/qgm/archive/
            echo "Archived: snapshot_${TODAY}.json"
          else
            echo "::error::Expected file live/output/snapshot_${TODAY}.json not found."
            exit 1
          fi

          # index.html — redirect to latest
          printf '<!DOCTYPE html>\n<html>\n<head><meta http-equiv="refresh" content="0;url=latest.html"><title>QGM</title></head>\n<body><p>Redirecting to <a href="latest.html">latest report</a>...</p></body>\n</html>\n' > _deploy/docs/qgm/index.html

          # archive/index.html — browsable list of all historical reports
          cd _deploy/docs/qgm/archive
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>QGM Archive</title>' > index.html
          echo '<style>body{font-family:-apple-system,sans-serif;max-width:800px;margin:40px auto;padding:0 20px}' >> index.html
          echo 'a{display:block;padding:6px 0;color:#1a5f3f;text-decoration:none}a:hover{text-decoration:underline}</style>' >> index.html
          echo '</head><body><h1>QGM Screener Archive</h1><p><a href="../latest.html">&larr; Latest Report</a></p>' >> index.html
          for f in $(ls -r candidates_*.html 2>/dev/null); do
            DATE=$(echo "$f" | sed 's/candidates_//;s/\.html//')
            echo "<a href=\"$f\">$DATE</a>" >> index.html
          done
          echo '</body></html>' >> index.html

      - name: Push to financial-analysis-bot
        working-directory: _deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/qgm/
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "QGM screener update $(date -u +%Y-%m-%d)"
            git push
          fi
